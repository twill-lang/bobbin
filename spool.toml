# bobbin, read by spool. The subset spool parses is comments, one-level tables,
# quoted strings and single-line inline tables, and this file stays inside it.
name = "bobbin"
version = "0.1.0"

# Documentation only. twill has no package entry point, so spool records this
# and shows it in `spool list`; it does not enforce it.
entry = "src/suite.tw"

[dependencies]
# The language itself, pinned to the release this source was written against.
# spool has no notion of a toolchain dependency, so it is declared as an
# ordinary git dependency: the version is the thing that matters.
twill = { version = "^1.2.0", git = "https://github.com/martin-k-m/twill" }
